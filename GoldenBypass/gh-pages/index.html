<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Bypass</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
         background:#0a0a0a; color:#e0e0e0; display:flex; justify-content:center;
         align-items:center; min-height:100vh; text-align:center; }
  .container { padding:2rem; max-width:480px; }
  h1 { font-size:1.8rem; margin-bottom:1rem; color:#fff; }
  p { margin-bottom:2rem; color:#888; line-height:1.6; }
  .btn { display:inline-block; padding:1rem 2.5rem; background:#2563eb;
         color:#fff; text-decoration:none; border-radius:8px; font-weight:600;
         font-size:1.1rem; border:none; cursor:pointer; transition:background .2s; }
  .btn:active { background:#1d4ed8; }
  .status { margin-top:1.5rem; font-size:.9rem; color:#666; }
</style>
</head>
<body>
<div class="container">
  <h1>Golden Bypass</h1>
  <p>Toque abaixo para instalar o aplicativo.</p>
  <a id="downloadBtn" class="btn" href="GoldenBypass-signed.apk" download>Instalar</a>
  <div class="status" id="status"></div>
</div>
<script>
  document.getElementById('downloadBtn').addEventListener('click', function() {
    document.getElementById('status').textContent =
      'Baixando... abra o arquivo baixado para instalar.';
  });
</script>
</body>
</html>
